[project]
name = "crochet-server"
version = "0.1.0"
description = "Sync server for the crochet tracker"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]

[dependency-groups]
dev = [
    "httpx>=0.25",
]

[tool.uv]
package = false
