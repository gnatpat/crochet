<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Crochet tracker</title>
  <style>
    :root {
      --bg: #14171a;
      --fg: #f1f1f1;
      --muted: #8a93a0;
      --accent: #5cc8ff;
      --card: #1f242b;
      --card-hi: #2a313a;
      --danger: #ff6b6b;
      --warn: #ffc857;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fafafa;
        --fg: #1a1a1a;
        --muted: #666;
        --accent: #0070c9;
        --card: #fff;
        --card-hi: #eef1f5;
        --danger: #c33;
        --warn: #a86b00;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; background: var(--bg); color: var(--fg); min-height: 100vh;
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    #app { max-width: 640px; margin: 0 auto; padding: 16px; min-height: 100vh; }
    header { display: flex; align-items: center; gap: 8px; padding-bottom: 12px; }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; flex: 1; }
    button { font: inherit; }
    .icon-btn {
      background: none; border: 0; color: var(--fg); font-size: 20px;
      cursor: pointer; padding: 8px 10px; border-radius: 6px; line-height: 1;
    }
    .icon-btn:hover { background: var(--card-hi); }
    .btn {
      background: var(--accent); color: #001; border: 0; padding: 12px 16px;
      border-radius: 10px; cursor: pointer; font-weight: 600;
    }
    .btn:hover { filter: brightness(1.05); }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn.secondary { background: var(--card-hi); color: var(--fg); }
    .muted { color: var(--muted); }
    .row { display: flex; gap: 8px; align-items: center; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; }
    .hidden { display: none !important; }

    /* Project list */
    .proj-item {
      display: flex; align-items: center; gap: 12px; padding: 14px;
      background: var(--card); border-radius: 10px; margin-bottom: 8px;
    }
    .proj-name { flex: 1; font-weight: 600; cursor: pointer; }
    .proj-meta { font-size: 13px; color: var(--muted); font-weight: 400; margin-top: 2px; }

    /* Forms */
    input[type=text], textarea {
      width: 100%; padding: 12px; border-radius: 8px;
      border: 1px solid var(--card-hi); background: var(--card); color: var(--fg);
      font: inherit;
    }
    textarea {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      min-height: 220px; resize: vertical; white-space: pre;
    }
    .err-list, .warn-list, .ok-box {
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px;
      background: var(--card); padding: 12px; border-radius: 8px; white-space: pre-wrap;
    }
    .err-list { border-left: 4px solid var(--danger); }
    .warn-list { border-left: 4px solid var(--warn); }
    .ok-box { border-left: 4px solid var(--accent); color: var(--muted); }

    /* Tracker */
    .row-head { padding: 14px; background: var(--card); border-radius: 12px; margin-bottom: 12px; }
    .row-num { font-size: 22px; font-weight: 700; }
    .row-num small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 6px; }
    .row-raw {
      font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--muted);
      margin-top: 6px; font-size: 13px; word-break: break-word;
    }
    .pbar { height: 8px; background: var(--card-hi); border-radius: 4px; overflow: hidden; margin: 12px 0 6px; }
    .pbar > div { height: 100%; background: var(--accent); transition: width 100ms ease-out; }
    .row-progress { font-size: 14px; color: var(--muted); }

    .big-button {
      position: relative; overflow: hidden;
      width: 100%; min-height: 50vh; background: var(--accent); color: #001;
      border: 0; border-radius: 16px; cursor: pointer; padding: 24px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 8px; box-shadow: 0 6px 0 rgba(0,0,0,0.2);
      transition: transform 60ms, box-shadow 60ms, filter 80ms;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .big-button > * { position: relative; z-index: 1; }
    .big-button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
    .big-button:disabled { opacity: 0.7; cursor: default; box-shadow: none; }
    @keyframes press-pulse {
      0%   { transform: scale(1);    filter: brightness(1)   saturate(1); }
      18%  { transform: scale(0.90); filter: brightness(1.5) saturate(1.3); }
      55%  { transform: scale(1.04); filter: brightness(1.1) saturate(1); }
      100% { transform: scale(1);    filter: brightness(1)   saturate(1); }
    }
    .big-button.pressed:not(:disabled) { animation: press-pulse 260ms ease-out; }
    /* Ripple */
    .big-button::before {
      content: ''; position: absolute; top: 50%; left: 50%;
      width: 24px; height: 24px; border-radius: 50%;
      background: rgba(255,255,255,0.75);
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none; opacity: 0; z-index: 0;
    }
    .big-button.pressed:not(:disabled)::before { animation: ripple 360ms ease-out; }
    @keyframes ripple {
      0%   { transform: translate(-50%, -50%) scale(0);  opacity: 0.75; }
      70%  { opacity: 0.3; }
      100% { transform: translate(-50%, -50%) scale(45); opacity: 0; }
    }
    @keyframes pbar-pulse {
      0%   { background: var(--accent); }
      30%  { background: #fff; }
      100% { background: var(--accent); }
    }
    .pbar > div.pulse { animation: pbar-pulse 200ms ease-out; }

    /* Info card (shown for sections, notes, or marker prompts) */
    .info-card {
      background: var(--card); border-radius: 16px; padding: 20px 22px;
      margin-bottom: 12px;
      display: flex; flex-direction: column; gap: 14px;
      border-left: 6px solid var(--accent);
    }
    /* Section/note cards are the main thing on screen — claim some height.
       Marker cards sit alongside the row-head so they grow to fit content. */
    .info-card.section, .info-card.note { min-height: 40vh; }
    .info-card.section { border-left-color: var(--accent); }
    .info-card.note    { border-left-color: var(--accent-2, #ff8acc); }
    .info-card.marker  { border-left-color: var(--warn); }
    .info-card-eyebrow {
      font-size: 12px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.8px;
    }
    .info-card-title { font-size: 26px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.2; }
    .info-card-body {
      font-size: 17px; line-height: 1.55; white-space: pre-wrap; color: var(--fg);
    }
    .info-card-body + .info-card-body {
      margin-top: 0; padding-top: 12px; border-top: 1px solid var(--card-hi);
    }
    .info-card-foot {
      font-size: 13px; color: var(--muted); margin-top: auto;
    }
    /* Compact big-button used when content lives in an info-card above */
    .big-button.compact { min-height: 14vh; padding: 16px; }
    .big-button.compact .next-label { font-size: 22px; }
    .big-button.compact .hint { font-size: 11px; margin-top: 6px; }
    .big-button.compact .next-small { display: none; }

    /* Section label above row number */
    .section-label {
      font-size: 12px; font-weight: 700; color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px;
    }

    /* Options page */
    .option-row { background: var(--card); border-radius: 12px; padding: 14px; }
    .option-row label { display: flex; gap: 14px; align-items: flex-start; cursor: pointer; }
    .option-row input[type=checkbox] { width: 22px; height: 22px; margin-top: 2px; flex-shrink: 0; }
    .option-row .option-hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .big-button .next-small { font-size: 14px; opacity: 0.7; font-weight: 500; }
    .big-button .next-label { font-size: 44px; font-weight: 800; letter-spacing: -0.5px; text-align: center; }
    .big-button .hint { font-size: 12px; opacity: 0.55; margin-top: 16px; }

    .tracker-actions { display: flex; gap: 8px; margin-top: 12px; }
    .tracker-actions .btn { flex: 1; }

    /* Drawer */
    .scrim {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 9;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .drawer {
      background: var(--card); border-radius: 12px; padding: 16px;
      max-width: 480px; width: 100%; display: flex; flex-direction: column; gap: 10px;
      max-height: 90vh; overflow: auto;
    }
    .drawer .btn { width: 100%; text-align: left; }
    .drawer h3 { margin: 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="lib.js"></script>
  <script src="convert-prompt.js"></script>
  <script>
  (function () {
    'use strict';
    const C = window.Crochet;
    const app = document.getElementById('app');

    // ---- Storage ----
    const KEYS = {
      projects: 'wooble:projects',
      project: (id) => 'wooble:project:' + id,
      tombstones: 'wooble:tombstones',
      sync: 'wooble:sync',
    };
    function loadProjects() {
      try { return JSON.parse(localStorage.getItem(KEYS.projects)) || []; }
      catch (e) { return []; }
    }
    function saveProjects(list) { localStorage.setItem(KEYS.projects, JSON.stringify(list)); }
    function loadProject(id) {
      try {
        const p = JSON.parse(localStorage.getItem(KEYS.project(id)));
        if (p && p.cursor) p.cursor = C.normalizeCursor(p.cursor);
        return p;
      } catch (e) { return null; }
    }
    function saveProject(p) {
      p.updatedAt = Date.now();
      localStorage.setItem(KEYS.project(p.id), JSON.stringify(p));
      scheduleSync();
    }
    function deleteProject(id) {
      const proj = loadProject(id);
      const idx = loadProjects().find(x => x.id === id);
      if (proj || idx) {
        const t = loadTombstones();
        t.push({
          id,
          name: (proj && proj.name) || (idx && idx.name) || '(deleted)',
          rawText: (proj && proj.rawText) || '',
          cursor: (proj && proj.cursor) || C.initialState(),
          createdAt: (idx && idx.createdAt) || Date.now(),
          lastOpenedAt: (idx && idx.lastOpenedAt) || Date.now(),
          updatedAt: Date.now(),
          deletedAt: Date.now(),
        });
        saveTombstones(t);
      }
      localStorage.removeItem(KEYS.project(id));
      saveProjects(loadProjects().filter(p => p.id !== id));
      scheduleSync();
    }
    function touchProject(id) {
      const list = loadProjects();
      const p = list.find(x => x.id === id);
      if (p) { p.lastOpenedAt = Date.now(); saveProjects(list); }
    }
    function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

    // ---- Options ----
    const OPTIONS_KEY = 'wooble:options';
    function loadOptions() {
      try { return JSON.parse(localStorage.getItem(OPTIONS_KEY)) || {}; }
      catch (e) { return {}; }
    }
    function saveOptions(o) { localStorage.setItem(OPTIONS_KEY, JSON.stringify(o)); }

    // ---- LLM config (BYO OpenRouter key) ----
    const LLM_KEY = 'wooble:llm';
    function loadLlmCfg() {
      try { return JSON.parse(localStorage.getItem(LLM_KEY)) || {}; }
      catch (e) { return {}; }
    }
    function saveLlmCfg(c) { localStorage.setItem(LLM_KEY, JSON.stringify(c)); }
    const DEFAULT_LLM_MODEL = 'anthropic/claude-haiku-4.5';

    async function llmConvert(rawText, key, model, thinking) {
      const body = {
        model: model || DEFAULT_LLM_MODEL,
        messages: [{ role: 'user', content: CONVERT_PROMPT + rawText }],
        temperature: 0,
        max_tokens: 4000,
      };
      // OpenRouter `reasoning` param: gives the model a scratchpad on supported
      // models (Anthropic Claude, OpenAI o-series, etc.). The thinking lands in
      // a separate channel so it doesn't pollute the DSL output we read from
      // `content`. Defaults to "low" effort — small cost bump, useful quality
      // gain on verbose pattern conversions.
      if (thinking !== false) {
        body.reasoning = { effort: 'low' };
      }
      const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + key,
          'Content-Type': 'application/json',
          'HTTP-Referer': location.origin === 'null' ? 'https://crochet.local/' : location.origin,
          'X-Title': 'Crochet tracker',
        },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        const t = await res.text().catch(() => '');
        let detail = t;
        try { detail = JSON.parse(t).error?.message || t; } catch (e) {}
        throw new Error('OpenRouter ' + res.status + ': ' + (detail || res.statusText).slice(0, 240));
      }
      const data = await res.json();
      let out = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
      out = out.trim();
      // Strip ``` fences if the model included them despite the instruction
      if (out.startsWith('```')) {
        const lines = out.split('\n');
        if (lines[lines.length - 1].startsWith('```')) lines.pop();
        lines.shift();
        out = lines.join('\n').trim();
      }
      return out;
    }

    // ---- Sync config + tombstones ----
    function loadSyncCfg() {
      try { return JSON.parse(localStorage.getItem(KEYS.sync)) || {}; }
      catch (e) { return {}; }
    }
    function saveSyncCfg(c) { localStorage.setItem(KEYS.sync, JSON.stringify(c)); }
    function loadTombstones() {
      try { return JSON.parse(localStorage.getItem(KEYS.tombstones)) || []; }
      catch (e) { return []; }
    }
    function saveTombstones(t) { localStorage.setItem(KEYS.tombstones, JSON.stringify(t)); }

    function genSyncKey() {
      // 32 hex chars, ~128 bits entropy. crypto.randomUUID is fine but contains hyphens.
      const buf = new Uint8Array(16);
      crypto.getRandomValues(buf);
      return [...buf].map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ---- Sync engine ----
    const syncStatus = { state: 'idle', at: 0, error: null, listeners: new Set() };
    function setSyncStatus(state, error) {
      syncStatus.state = state; syncStatus.at = Date.now(); syncStatus.error = error || null;
      syncStatus.listeners.forEach(fn => { try { fn(syncStatus); } catch (e) {} });
    }
    function onSyncStatus(fn) {
      syncStatus.listeners.add(fn);
      return () => syncStatus.listeners.delete(fn);
    }

    function gatherForSync() {
      const out = [];
      const idx = loadProjects();
      const byId = new Map(idx.map(m => [m.id, m]));
      for (const meta of idx) {
        const p = loadProject(meta.id);
        if (!p) continue;
        out.push({
          id: p.id, name: p.name, rawText: p.rawText,
          cursor: p.cursor,
          createdAt: meta.createdAt || p.createdAt || Date.now(),
          lastOpenedAt: meta.lastOpenedAt || Date.now(),
          updatedAt: p.updatedAt || meta.lastOpenedAt || Date.now(),
        });
      }
      for (const t of loadTombstones()) out.push(t);
      return out;
    }

    function applyMerged(merged) {
      // Reset local projects to match server's view (but tombstones live separately)
      const oldIdx = loadProjects();
      for (const m of oldIdx) localStorage.removeItem(KEYS.project(m.id));
      const newIdx = [];
      const tombstones = [];
      for (const p of merged) {
        if (p.deletedAt) {
          tombstones.push(p);
          continue;
        }
        localStorage.setItem(KEYS.project(p.id), JSON.stringify({
          id: p.id, name: p.name, rawText: p.rawText,
          cursor: p.cursor, updatedAt: p.updatedAt,
        }));
        newIdx.push({
          id: p.id, name: p.name,
          createdAt: p.createdAt || Date.now(),
          lastOpenedAt: p.lastOpenedAt || Date.now(),
        });
      }
      saveProjects(newIdx);
      saveTombstones(tombstones);
    }

    async function syncNow() {
      const cfg = loadSyncCfg();
      if (!cfg.key || !cfg.server) { setSyncStatus('off'); return { skipped: true }; }
      setSyncStatus('syncing');
      try {
        const url = cfg.server.replace(/\/$/, '') + '/api/sync';
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Sync-Key': cfg.key },
          body: JSON.stringify({ projects: gatherForSync() }),
        });
        if (!res.ok) {
          const t = await res.text().catch(() => '');
          throw new Error('HTTP ' + res.status + (t ? ': ' + t.slice(0, 200) : ''));
        }
        const data = await res.json();
        applyMerged(data.projects || []);
        cfg.lastSyncAt = Date.now(); cfg.lastError = null; saveSyncCfg(cfg);
        setSyncStatus('synced');
        // Re-render list view if we're on it
        if (route() === '#/' || route() === '#' || route() === '') render();
        return { ok: true };
      } catch (e) {
        cfg.lastError = String(e.message || e); saveSyncCfg(cfg);
        setSyncStatus('error', e.message);
        return { ok: false, error: e.message };
      }
    }

    let syncTimer = null;
    function scheduleSync(delayMs) {
      const cfg = loadSyncCfg();
      if (!cfg.key || !cfg.server || cfg.autoSync === false) return;
      if (syncTimer) clearTimeout(syncTimer);
      syncTimer = setTimeout(() => { syncNow(); }, delayMs == null ? 2500 : delayMs);
    }

    // ---- DOM helpers ----
    function el(tag, attrs) {
      const e = document.createElement(tag);
      if (attrs) for (const k in attrs) {
        const v = attrs[k];
        if (v == null) continue;
        if (k === 'class') e.className = v;
        else if (k === 'style') e.style.cssText = v;
        else if (k.startsWith('on')) e[k] = v;
        else e.setAttribute(k, v);
      }
      for (let i = 2; i < arguments.length; i++) {
        const c = arguments[i];
        if (c == null || c === false) continue;
        if (Array.isArray(c)) c.forEach(x => x != null && e.appendChild(typeof x === 'string' ? document.createTextNode(x) : x));
        else e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      }
      return e;
    }
    function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }

    // ---- Routing ----
    function route() { return location.hash || '#/'; }
    function navigate(h) { location.hash = h; }
    window.addEventListener('hashchange', render);

    // ---- View: project list ----
    function renderList() {
      const projects = loadProjects().slice().sort((a, b) => (b.lastOpenedAt || 0) - (a.lastOpenedAt || 0));
      const cfg = loadSyncCfg();
      const optionsBtn = el('button', {
        class: 'icon-btn', title: 'Options',
        onclick: () => navigate('#/settings'),
      }, '⚙');
      const syncBtn = el('button', {
        class: 'icon-btn', title: 'Sync settings',
        onclick: () => navigate('#/sync'),
      }, cfg.key && cfg.server ? '☁︎' : '☁');
      const header = el('header', null,
        el('h1', null, 'Crochet tracker'),
        optionsBtn,
        syncBtn,
        el('button', { class: 'btn', onclick: () => navigate('#/new') }, '+ New')
      );
      let body;
      if (projects.length === 0) {
        body = el('div', { class: 'card muted' },
          "No projects yet. Tap '+ New' to paste a pattern.");
      } else {
        body = el('div', null);
        for (const p of projects) {
          const proj = loadProject(p.id);
          const parsed = proj ? C.parsePattern(proj.rawText) : { blocks: [], rows: [] };
          const cur = (proj && proj.cursor) || { blockIndex: 0 };
          const done = !proj || cur.blockIndex >= parsed.blocks.length;
          // Find the most recent row at or before the cursor for display.
          let curRow = null;
          let curSection = null;
          for (let i = 0; i < parsed.blocks.length && i <= cur.blockIndex; i++) {
            const b = parsed.blocks[i];
            if (b.type === 'row') curRow = b;
            if (b.type === 'section') curSection = b.name;
            else if (b.section != null) curSection = b.section;
          }
          // "Y" should be the last row of the *current* section, not overall
          const sectionKey = (curRow ? curRow.section : curSection) || null;
          const lastInSection = C.lastRowOfSection(parsed, sectionKey);
          const sectionPrefix = curSection ? curSection + ' · ' : '';
          const meta = done
            ? 'Complete'
            : sectionPrefix + 'Row ' + (curRow ? curRow.rowNumber : '1') +
              ' of ' + (lastInSection ? lastInSection.rowNumber : '?');
          body.appendChild(el('div', { class: 'proj-item' },
            el('div', { class: 'proj-name', onclick: () => navigate('#/p/' + p.id) },
              p.name,
              el('div', { class: 'proj-meta' }, meta)
            ),
            el('button', {
              class: 'icon-btn', title: 'Delete',
              onclick: (e) => {
                e.stopPropagation();
                if (confirm('Delete "' + p.name + '"?')) { deleteProject(p.id); render(); }
              }
            }, '🗑')
          ));
        }
      }
      clear(app); app.append(header, body);
    }

    // ---- View: new project ----
    function renderNew() {
      const header = el('header', null,
        el('button', { class: 'icon-btn', onclick: () => navigate('#/') }, '←'),
        el('h1', null, 'New project')
      );
      const nameInput = el('input', { type: 'text', placeholder: 'Project name (e.g. Otto the Octopus)' });
      const patternInput = el('textarea', {
        placeholder:
          'Paste your pattern, one row per line. Examples:\n\n' +
          '1: 6 sc in MR (6)\n' +
          '2: 6 inc (12)\n' +
          '3: [1 sc, inc] x 6 (18)\n' +
          '4-7: 18 sc (18)\n' +
          '8: [1 sc, dec] x 6 (12)\n' +
          '9: 6 dec (6)\n' +
          '10: FO\n\n' +
          '# Comments start with # and are ignored.'
      });
      const errBox = el('div', { class: 'stack' });

      function preview() {
        clear(errBox);
        const text = patternInput.value;
        if (!text.trim()) return;
        const parsed = C.parsePattern(text);
        if (parsed.errors.length) {
          errBox.appendChild(el('div', { class: 'err-list' },
            'Errors:\n' + parsed.errors.map(e => '  line ' + e.line + ': ' + e.message).join('\n')));
        }
        if (parsed.warnings.length) {
          errBox.appendChild(el('div', { class: 'warn-list' },
            'Warnings (you can still proceed):\n' + parsed.warnings.map(w => '  ' + w.message).join('\n')));
        }
        if (!parsed.errors.length && parsed.rows.length > 0) {
          errBox.appendChild(el('div', { class: 'ok-box' },
            parsed.rows.length + ' row' + (parsed.rows.length === 1 ? '' : 's') + ' parsed.'));
        }
      }
      patternInput.addEventListener('input', preview);

      function create() {
        const name = (nameInput.value || '').trim();
        const text = patternInput.value;
        if (!name) { alert('Please give the project a name.'); nameInput.focus(); return; }
        const parsed = C.parsePattern(text);
        if (parsed.errors.length) { alert('Please fix parse errors first.'); return; }
        if (parsed.rows.length === 0) { alert('No rows parsed.'); return; }
        const id = newId();
        saveProject({ id, name, rawText: text, cursor: C.initialState() });
        const list = loadProjects();
        list.push({ id, name, createdAt: Date.now(), lastOpenedAt: Date.now() });
        saveProjects(list);
        navigate('#/p/' + id);
      }

      const aiBtn = el('button', {
        class: 'btn secondary',
        onclick: () => aiConvertDialog(patternInput),
      }, '✨ Convert with AI');
      const actions = el('div', { class: 'row' },
        el('button', { class: 'btn secondary', onclick: () => navigate('#/') }, 'Cancel'),
        aiBtn,
        el('div', { style: 'flex:1' }),
        el('button', { class: 'btn', onclick: create }, 'Parse & start')
      );

      clear(app);
      app.append(header, el('div', { class: 'stack' }, nameInput, patternInput, errBox, actions));
      setTimeout(() => nameInput.focus(), 0);
    }

    // ---- View: tracker ----
    function renderTracker(id) {
      const project = loadProject(id);
      if (!project) { navigate('#/'); return; }
      touchProject(id);
      const parsed = C.parsePattern(project.rawText);

      if (parsed.errors.length) {
        clear(app);
        app.append(
          el('header', null,
            el('button', { class: 'icon-btn', onclick: () => navigate('#/') }, '←'),
            el('h1', null, project.name)
          ),
          el('div', { class: 'err-list' },
            "Couldn't parse this pattern:\n" +
            parsed.errors.map(e => '  line ' + e.line + ': ' + e.message).join('\n')
          ),
          el('div', { style: 'margin-top:12px' },
            el('button', { class: 'btn', onclick: () => editPattern(project) }, 'Edit pattern')
          )
        );
        return;
      }

      // Repair cursor if pattern shrank
      let cur = C.normalizeCursor(project.cursor);
      if (cur.blockIndex > parsed.blocks.length) {
        cur = C.initialState();
        project.cursor = cur; saveProject(project);
      } else if (cur.blockIndex < parsed.blocks.length &&
                 cur.stepIndex > parsed.blocks[cur.blockIndex].pressSteps.length) {
        cur = { blockIndex: cur.blockIndex, stepIndex: parsed.blocks[cur.blockIndex].pressSteps.length, history: cur.history };
        project.cursor = cur; saveProject(project);
      } else {
        project.cursor = cur;
      }

      const infoCard = el('div', { class: 'info-card' });
      infoCard.style.display = 'none';
      const rowHead = el('div', { class: 'row-head' });
      rowHead.style.display = 'none';
      const bigBtn = el('button', { class: 'big-button', type: 'button' });
      const backBtn  = el('button', { class: 'btn secondary', onclick: doBack }, '← Back');
      const undoBtn  = el('button', { class: 'btn secondary', onclick: doUndo }, '↶ Undo');
      const nextRowBtn = el('button', { class: 'btn secondary', onclick: doSkipRow }, '✓ Row done');
      const actions = el('div', { class: 'tracker-actions' }, backBtn, undoBtn, nextRowBtn);

      // Last "row" in each section, used for "Row X of Y" display
      const lastRowPerSection = {};
      for (const b of parsed.blocks) {
        if (b.type === 'row') lastRowPerSection[b.section || ''] = b;
      }

      function paint() {
        const cur = project.cursor;
        const done = C.isDone(cur, parsed);
        const block = done ? null : C.currentBlock(cur, parsed);
        const markerMode = !!(cur.markerPending && !done);
        const sectionMode = !markerMode && block && block.type === 'section';
        const noteMode    = !markerMode && block && block.type === 'note';
        const rowMode     = !markerMode && block && block.type === 'row';

        clear(infoCard);
        infoCard.classList.remove('section', 'note', 'marker');

        if (done) {
          // Done state: show row-head with completion message
          rowHead.style.display = '';
          infoCard.style.display = 'none';
          bigBtn.classList.remove('compact');
        } else if (markerMode) {
          // Marker prompt — keep the row-head visible so the user still sees
          // which row/stitch they're on while placing the marker.
          infoCard.style.display = '';
          infoCard.classList.add('marker');
          rowHead.style.display = '';
          bigBtn.classList.add('compact');
          const row = block && block.type === 'row' ? block : null;
          infoCard.append(
            el('div', { class: 'info-card-eyebrow' }, '🔖 Stitch marker'),
            el('div', { class: 'info-card-title' }, 'Place a stitch marker'),
            el('div', { class: 'info-card-body' },
              'Put a stitch marker on the stitch you just made (the first stitch of ' +
              (row ? 'Row ' + row.rowNumber : 'this row') + '). Then tap below to continue.'),
            el('div', { class: 'info-card-foot' }, 'You can turn this off in ⚙ Options.'),
          );
        } else if (sectionMode) {
          // Section transition
          infoCard.style.display = '';
          infoCard.classList.add('section');
          rowHead.style.display = 'none';
          bigBtn.classList.add('compact');
          const prevName = C.previousSectionName(parsed, cur.blockIndex);
          const title = prevName
            ? 'Finished ' + prevName + ' · Next: ' + block.name
            : 'Starting ' + block.name;
          const children = [
            el('div', { class: 'info-card-eyebrow' }, prevName ? '✨ Next part' : '✨ First part'),
            el('div', { class: 'info-card-title' }, title),
          ];
          for (const intro of (block.intro || [])) {
            children.push(el('div', { class: 'info-card-body' }, intro));
          }
          children.push(el('div', { class: 'info-card-foot' }, 'Tap below to begin this section.'));
          infoCard.append(...children);
        } else if (noteMode) {
          // Note card
          infoCard.style.display = '';
          infoCard.classList.add('note');
          rowHead.style.display = 'none';
          bigBtn.classList.add('compact');
          const lastRow = sectionLastRowBefore(parsed, cur.blockIndex, block.section);
          const where = lastRow ? 'After Row ' + lastRow.rowNumber : 'Before Row 1';
          const sectionTag = block.section ? block.section + ' · ' : '';
          infoCard.append(
            el('div', { class: 'info-card-eyebrow' }, '📝 ' + sectionTag + where),
            el('div', { class: 'info-card-body' }, block.content),
            el('div', { class: 'info-card-foot' }, 'Tap below when done reading.'),
          );
        } else if (rowMode) {
          // Row mode: full-size big button, row info above
          infoCard.style.display = 'none';
          rowHead.style.display = '';
          bigBtn.classList.remove('compact');
        }

        // Row head content (visible in row mode, marker mode, or done)
        clear(rowHead);
        if (done) {
          rowHead.append(
            el('div', { class: 'row-num' }, 'All rows complete'),
            el('div', { class: 'row-raw' }, project.name + ' — finished!')
          );
        } else if (rowMode || markerMode) {
          const row = block;
          const prog = C.rowProgress(cur, parsed);
          const lastInSection = lastRowPerSection[row.section || ''];
          const lastNum = lastInSection ? lastInSection.rowNumber : row.rowNumber;
          const rangeNote = row.rangeEnd && row.rangeEnd !== row.rangeStart
            ? ' (within ' + row.rangeStart + '–' + row.rangeEnd + ')' : '';
          const sectionLabel = row.section ? el('div', { class: 'section-label' }, row.section) : null;
          rowHead.append(
            sectionLabel,
            el('div', { class: 'row-num' },
              'Row ' + row.rowNumber,
              el('small', null, '/ ' + lastNum + rangeNote)
            ),
            el('div', { class: 'row-raw' }, row.rawLine.trim()),
            (function () {
              const bar = el('div', { class: 'pbar' });
              const fill = el('div');
              const pct = prog.total ? Math.round((prog.done / prog.total) * 100) : 0;
              fill.style.width = pct + '%';
              bar.appendChild(fill);
              return bar;
            })(),
            el('div', { class: 'row-progress' }, prog.done + ' / ' + prog.total + ' stitches')
          );
        }

        // Big button
        clear(bigBtn);
        if (done) {
          bigBtn.disabled = true;
          bigBtn.appendChild(el('div', { class: 'next-label' }, '🎉 Done!'));
        } else {
          bigBtn.disabled = false;
          bigBtn.appendChild(el('div', { class: 'next-small' }, 'Next:'));
          bigBtn.appendChild(el('div', { class: 'next-label' }, C.nextLabel(cur, parsed)));
          bigBtn.appendChild(el('div', { class: 'hint' }, 'Tap, or press Space / Enter'));
        }
        backBtn.disabled    = done || (cur.blockIndex === 0 && cur.stepIndex === 0 && !cur.markerPending);
        undoBtn.disabled    = (cur.history.length === 0);
        // Row-done only makes sense when standing on a row
        nextRowBtn.disabled = !rowMode;
      }

      function sectionLastRowBefore(parsed, blockIndex, section) {
        for (let i = blockIndex - 1; i >= 0; i--) {
          const b = parsed.blocks[i];
          if (b.type === 'row' && b.section === section) return b;
        }
        return null;
      }

      function flashPress() {
        bigBtn.classList.remove('pressed');
        // Force reflow so the animation restarts on rapid presses.
        void bigBtn.offsetWidth;
        bigBtn.classList.add('pressed');
        const fill = rowHead.querySelector('.pbar > div');
        if (fill) {
          fill.classList.remove('pulse');
          void fill.offsetWidth;
          fill.classList.add('pulse');
        }
      }
      // Two animations run on .pressed: press-pulse (260ms) on the button,
      // and ripple (360ms) on the ::before. Wait for the slower one so the
      // ripple isn't killed mid-flight.
      bigBtn.addEventListener('animationend', (e) => {
        if (e.animationName === 'ripple') bigBtn.classList.remove('pressed');
      });

      function doPress() {
        const opts = loadOptions();
        const next = C.press(project.cursor, parsed, opts);
        if (next === project.cursor) return;
        project.cursor = next;
        paint();
        flashPress();
        saveProject(project);
      }
      function doUndo() {
        const next = C.undo(project.cursor);
        if (next === project.cursor) return;
        project.cursor = next;
        paint();
        saveProject(project);
      }
      function doBack() {
        const next = C.back(project.cursor, parsed);
        if (next === project.cursor) return;
        project.cursor = next;
        paint();
        saveProject(project);
      }
      function doSkipRow() {
        if (C.isDone(project.cursor, parsed)) return;
        const block = C.currentBlock(project.cursor, parsed);
        if (!block || block.type !== 'row') return;  // only meaningful on a row
        project.cursor = C.jumpTo(project.cursor, project.cursor.blockIndex + 1, 0);
        paint();
        flashPress();
        saveProject(project);
      }

      bigBtn.addEventListener('click', doPress);

      function onKey(e) {
        if (e.target.matches('input, textarea')) return;
        if (e.code === 'Space' || e.code === 'Enter') {
          e.preventDefault();
          doPress();
        } else if (e.code === 'Backspace') {
          e.preventDefault();
          doUndo();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          doBack();
        }
      }
      document.addEventListener('keydown', onKey);
      cleanupFns.push(() => document.removeEventListener('keydown', onKey));

      const header = el('header', null,
        el('button', { class: 'icon-btn', onclick: () => navigate('#/') }, '←'),
        el('h1', null, project.name),
        el('button', { class: 'icon-btn', title: 'Menu', onclick: () => openMenu(project, parsed) }, '☰')
      );
      clear(app);
      // rowHead first so when both are shown (marker mode), row context appears
      // above the call-to-action instruction.
      app.append(header, rowHead, infoCard, bigBtn, actions);
      paint();
    }

    // ---- Drawer / menu ----
    function makeScrim() {
      const scrim = el('div', { class: 'scrim' });
      scrim.onclick = (e) => { if (e.target === scrim) document.body.removeChild(scrim); };
      return scrim;
    }
    function openMenu(project, parsed) {
      const scrim = makeScrim();
      const close = () => document.body.removeChild(scrim);
      const drawer = el('div', { class: 'drawer' },
        el('h3', null, 'Menu'),
        el('button', { class: 'btn secondary', onclick: () => { close(); jumpDialog(project, parsed); } }, 'Jump to row…'),
        el('button', { class: 'btn secondary', onclick: () => { close(); editPattern(project); } }, 'Edit pattern'),
        el('button', { class: 'btn secondary', onclick: () => { close(); navigate('#/'); } }, 'Back to projects'),
        el('button', { class: 'btn', onclick: close }, 'Close')
      );
      scrim.appendChild(drawer);
      document.body.appendChild(scrim);
    }
    function jumpDialog(project, parsed) {
      const scrim = makeScrim();
      const close = () => document.body.removeChild(scrim);

      const sections = C.sectionsOf(parsed);
      // Find the current row + section for sensible defaults
      let curBlock = parsed.blocks[project.cursor.blockIndex];
      let curRow = curBlock && curBlock.type === 'row' ? curBlock :
                   (function () {
                     for (let i = project.cursor.blockIndex - 1; i >= 0; i--) {
                       if (parsed.blocks[i] && parsed.blocks[i].type === 'row') return parsed.blocks[i];
                     }
                     return null;
                   })();
      const defaultSection = curRow && curRow.section != null ? curRow.section : sections[0];
      const defaultRowNum = curRow ? curRow.rowNumber : '';

      function rowsInSection(sec) {
        return parsed.blocks.filter(b => b.type === 'row' && (b.section || null) === (sec || null));
      }

      let sectionSelect = null;
      let drawerContents = [];

      if (sections.length > 1) {
        sectionSelect = el('select');
        for (const s of sections) {
          const opt = document.createElement('option');
          opt.value = s; opt.textContent = s;
          if (s === defaultSection) opt.selected = true;
          sectionSelect.appendChild(opt);
        }
        sectionSelect.style.cssText = 'width:100%; padding:12px; border-radius:8px; border:1px solid var(--card-hi); background:var(--card); color:var(--fg); font: inherit;';
        drawerContents.push(el('div', { class: 'muted', style: 'font-size:13px' }, 'Section'), sectionSelect);
      }

      const input = el('input', { type: 'text', placeholder: 'Row number', value: defaultRowNum });
      function sectionRowsInfo() {
        const sec = sectionSelect ? sectionSelect.value : (sections[0] || null);
        const rows = rowsInSection(sec);
        if (!rows.length) return '';
        return 'Rows ' + rows[0].rowNumber + '–' + rows[rows.length - 1].rowNumber +
               (sec ? ' in ' + sec : '');
      }
      const hint = el('div', { class: 'muted', style: 'font-size:13px' }, sectionRowsInfo());
      if (sectionSelect) sectionSelect.addEventListener('change', () => { hint.textContent = sectionRowsInfo(); });

      function go() {
        const sec = sectionSelect ? sectionSelect.value : (sections[0] !== undefined ? sections[0] : null);
        const target = parseInt(input.value, 10);
        if (isNaN(target)) { alert('Enter a row number.'); return; }
        const idx = parsed.blocks.findIndex(b =>
          b.type === 'row' && b.rowNumber === target && (b.section || null) === (sec || null));
        if (idx < 0) {
          alert('No row ' + target + (sec ? ' in section "' + sec + '"' : '') + '.');
          return;
        }
        project.cursor = C.jumpTo(project.cursor, idx, 0);
        saveProject(project);
        close();
        renderTracker(project.id);
      }

      drawerContents.push(
        el('div', { class: 'muted', style: 'font-size:13px' }, 'Row number'),
        input,
        hint,
        el('div', { class: 'row' },
          el('button', { class: 'btn secondary', onclick: close }, 'Cancel'),
          el('div', { style: 'flex:1' }),
          el('button', { class: 'btn', onclick: go }, 'Jump')
        )
      );
      const drawer = el('div', { class: 'drawer' },
        el('h3', null, 'Jump to row'),
        ...drawerContents
      );
      scrim.appendChild(drawer);
      document.body.appendChild(scrim);
      setTimeout(() => { input.focus(); input.select(); }, 0);
      input.addEventListener('keydown', e => { if (e.code === 'Enter') { e.preventDefault(); go(); } });
    }
    function editPattern(project) {
      const scrim = makeScrim();
      const close = () => document.body.removeChild(scrim);
      const ta = el('textarea', null);
      ta.value = project.rawText;
      const errBox = el('div', { class: 'stack' });
      function save() {
        const text = ta.value;
        const parsed = C.parsePattern(text);
        clear(errBox);
        if (parsed.errors.length) {
          errBox.appendChild(el('div', { class: 'err-list' },
            parsed.errors.map(e => 'line ' + e.line + ': ' + e.message).join('\n')));
          return;
        }
        const oldParsed = C.parsePattern(project.rawText);
        const oldBlock = oldParsed.blocks[project.cursor.blockIndex];
        const newBlock = parsed.blocks[project.cursor.blockIndex];
        const blockChanged = !oldBlock || !newBlock || oldBlock.rawLine !== newBlock.rawLine;
        const stepOOB = newBlock && project.cursor.stepIndex > newBlock.pressSteps.length;
        if (blockChanged || stepOOB) {
          if (!confirm('The current row changed; position will reset to the start. Continue?')) return;
          project.cursor = C.initialState();
        }
        project.rawText = text;
        saveProject(project);
        // Also update name in index if needed (no, name not edited here)
        close();
        renderTracker(project.id);
      }
      const drawer = el('div', { class: 'drawer', style: 'max-width: 640px' },
        el('h3', null, 'Edit pattern'),
        ta,
        errBox,
        el('div', { class: 'row' },
          el('button', { class: 'btn secondary', onclick: close }, 'Cancel'),
          el('div', { style: 'flex:1' }),
          el('button', { class: 'btn', onclick: save }, 'Save')
        )
      );
      scrim.appendChild(drawer);
      document.body.appendChild(scrim);
    }

    // ---- AI conversion dialog ----
    function aiConvertDialog(targetTextarea) {
      const scrim = makeScrim();
      const close = () => { try { document.body.removeChild(scrim); } catch (e) {} };
      let llm = loadLlmCfg();

      const raw = el('textarea', { placeholder: 'Paste the original pattern in any format. The AI will convert it to our DSL.' });
      raw.style.minHeight = '180px';
      const status = el('div', { class: 'muted', style: 'font-size:13px;min-height:1.2em' });

      // Key section — show only if no key stored, plus an "Edit key" toggle
      const keyInput = el('input', { type: 'password', placeholder: 'OpenRouter API key (sk-or-…)' });
      const modelInput = el('input', { type: 'text', placeholder: 'Model (default: ' + DEFAULT_LLM_MODEL + ')' });
      const keyRow = el('div', { class: 'stack' },
        el('div', { class: 'muted', style: 'font-size:13px' }, 'OpenRouter key (stored locally, never sent anywhere except OpenRouter)'),
        keyInput,
        el('div', { class: 'muted', style: 'font-size:13px;margin-top:4px' }, 'Model (optional)'),
        modelInput,
        el('div', { class: 'muted', style: 'font-size:12px' },
          'Default ' + DEFAULT_LLM_MODEL + ' is fast and cheap. For verbose / unusual patterns ' +
          'that the default struggles with, try ',
          (function () {
            const a = el('a', { href: '#', style: 'color: var(--accent); text-decoration: underline' }, 'anthropic/claude-sonnet-4.6');
            a.onclick = (e) => { e.preventDefault(); modelInput.value = 'anthropic/claude-sonnet-4.6'; };
            return a;
          })(),
          ' or ',
          (function () {
            const a = el('a', { href: '#', style: 'color: var(--accent); text-decoration: underline' }, 'anthropic/claude-opus-4.7');
            a.onclick = (e) => { e.preventDefault(); modelInput.value = 'anthropic/claude-opus-4.7'; };
            return a;
          })(),
          '.',
        ),
      );
      const editKeyBtn = el('button', { class: 'btn secondary', onclick: () => {
        keyInput.value = llm.key || '';
        modelInput.value = llm.model || '';
        keyRow.style.display = '';
        editKeyBtn.style.display = 'none';
      } }, '🔑 Edit key');
      const keyStatus = el('div', { class: 'muted', style: 'font-size:13px' });
      function refreshKeyUI() {
        llm = loadLlmCfg();
        if (llm.key) {
          keyRow.style.display = 'none';
          editKeyBtn.style.display = '';
          keyStatus.textContent = 'Key saved' + (llm.model ? ' · model: ' + llm.model : '') + '. Edit if needed.';
        } else {
          keyRow.style.display = '';
          editKeyBtn.style.display = 'none';
          keyStatus.textContent = 'No key yet. Paste your OpenRouter key — it stays in this browser.';
        }
      }
      refreshKeyUI();

      // Extended thinking toggle (defaults on)
      const thinkingCheckbox = el('input', { type: 'checkbox' });
      thinkingCheckbox.checked = (llm.thinking !== false);
      thinkingCheckbox.addEventListener('change', () => {
        const c = loadLlmCfg();
        c.thinking = thinkingCheckbox.checked;
        saveLlmCfg(c);
      });
      const thinkingRow = el('label', {
        style: 'display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer',
      },
        thinkingCheckbox,
        el('span', null, 'Use extended thinking — small cost bump, better on verbose patterns.'),
      );

      let busy = false;
      const convertBtn = el('button', { class: 'btn' }, 'Convert');
      async function go() {
        if (busy) return;
        // If key inputs are showing, persist their values
        if (keyRow.style.display !== 'none') {
          const k = keyInput.value.trim();
          const m = modelInput.value.trim();
          if (!k) { status.textContent = 'Enter your OpenRouter key first.'; return; }
          const prev = loadLlmCfg();
          saveLlmCfg({ key: k, model: m, thinking: prev.thinking !== false });
          refreshKeyUI();
        }
        llm = loadLlmCfg();
        const rawText = raw.value.trim();
        if (!rawText) { status.textContent = 'Paste a pattern to convert.'; raw.focus(); return; }
        busy = true;
        convertBtn.disabled = true;
        status.textContent = (llm.thinking !== false) ? 'Converting (with thinking)…' : 'Converting…';
        try {
          const out = await llmConvert(rawText, llm.key, llm.model, llm.thinking !== false);
          targetTextarea.value = out;
          targetTextarea.dispatchEvent(new Event('input'));
          close();
        } catch (e) {
          const msg = String(e.message || e);
          status.textContent = msg;
          if (/401|403|invalid|unauthorized/i.test(msg)) {
            // Probably a bad key — show the input again
            saveLlmCfg({ model: llm.model || '', thinking: llm.thinking !== false });
            refreshKeyUI();
            keyInput.value = '';
          }
        } finally {
          busy = false;
          convertBtn.disabled = false;
        }
      }
      convertBtn.onclick = go;

      const drawer = el('div', { class: 'drawer', style: 'max-width: 640px' },
        el('h3', null, '🤖 Convert with AI'),
        el('div', { class: 'muted', style: 'font-size:13px' },
          'Paste a pattern in any natural format and convert it to the tracker’s DSL via OpenRouter.'),
        raw,
        keyStatus,
        editKeyBtn,
        keyRow,
        thinkingRow,
        status,
        el('div', { class: 'row' },
          el('button', { class: 'btn secondary', onclick: close }, 'Cancel'),
          el('div', { style: 'flex:1' }),
          convertBtn,
        ),
      );
      scrim.appendChild(drawer);
      document.body.appendChild(scrim);
      setTimeout(() => raw.focus(), 0);
    }

    // ---- View: sync settings ----
    function renderSync() {
      const cfg = loadSyncCfg();
      const header = el('header', null,
        el('button', { class: 'icon-btn', onclick: () => navigate('#/') }, '←'),
        el('h1', null, 'Sync settings')
      );

      const status = el('div', { class: 'card muted' });
      function paintStatus() {
        clear(status);
        if (!cfg.key || !cfg.server) {
          status.appendChild(el('div', null, 'Local only. Set a server URL and a sync key, then "Sync now" to start.'));
          return;
        }
        const ago = cfg.lastSyncAt ? Math.max(0, Math.round((Date.now() - cfg.lastSyncAt) / 1000)) : null;
        const agoStr = ago == null ? 'never' : (ago < 60 ? ago + 's ago' : Math.round(ago / 60) + ' min ago');
        const s = syncStatus.state;
        const labels = {
          idle: 'Ready. Last synced: ' + agoStr,
          syncing: 'Syncing…',
          synced: 'Synced ' + agoStr,
          error: 'Error: ' + (syncStatus.error || cfg.lastError || 'unknown'),
          off: 'Off',
        };
        status.appendChild(el('div', null, labels[s] || ('Last synced: ' + agoStr)));
      }
      paintStatus();
      const off = onSyncStatus(paintStatus);
      cleanupFns.push(off);

      // Server input
      const serverInput = el('input', { type: 'text', placeholder: 'https://natpat.net' });
      serverInput.value = cfg.server || '';
      serverInput.addEventListener('change', () => {
        const c = loadSyncCfg();
        c.server = serverInput.value.trim();
        saveSyncCfg(c);
        paintStatus();
        renderSyncKey();
      });

      // Sync key block (with copy + regenerate)
      const keyInput = el('input', { type: 'text', placeholder: 'Generate or paste a sync key' });
      keyInput.value = cfg.key || '';
      keyInput.addEventListener('change', () => {
        const c = loadSyncCfg();
        c.key = keyInput.value.trim();
        saveSyncCfg(c);
        paintStatus();
        renderSyncKey();
      });
      const copyBtn = el('button', { class: 'btn secondary', onclick: () => {
        if (!keyInput.value) return;
        navigator.clipboard.writeText(keyInput.value).then(() => {
          copyBtn.textContent = '✓ Copied';
          setTimeout(() => { copyBtn.textContent = '📋 Copy'; }, 1200);
        });
      } }, '📋 Copy');
      const genBtn = el('button', { class: 'btn secondary', onclick: () => {
        if (cfg.key && !confirm('Replace your existing key? You will lose access to data synced under the old key (other devices keep their copy).')) return;
        const c = loadSyncCfg();
        c.key = genSyncKey();
        saveSyncCfg(c);
        keyInput.value = c.key;
        renderSyncKey();
      } }, '🎲 Generate new');

      const qrBox = el('div', { class: 'card', style: 'display:none;align-items:center;justify-content:center;padding:8px' });
      const qrBtn = el('button', { class: 'btn secondary', onclick: () => toggleQR() }, '📷 Show QR');
      function buildShareURL() {
        const c = loadSyncCfg();
        if (!c.key || !c.server) return null;
        const base = location.origin === 'null' ? '' : location.origin + location.pathname;
        const url = (base || c.server.replace(/\/$/, '') + '/') + '?syncKey=' + encodeURIComponent(c.key) +
                    '&server=' + encodeURIComponent(c.server);
        return url;
      }
      function renderQR() {
        clear(qrBox);
        const url = buildShareURL();
        if (!url) {
          qrBox.appendChild(el('div', { class: 'muted', style: 'padding:16px' },
            'Set both server and key before generating a QR code.'));
          return;
        }
        if (typeof window.qrcode !== 'function') {
          qrBox.appendChild(el('div', { class: 'muted', style: 'padding:16px' }, 'Loading QR library…'));
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js';
          s.onload = () => renderQR();
          s.onerror = () => {
            clear(qrBox);
            qrBox.appendChild(el('div', { class: 'muted', style: 'padding:16px' },
              "QR library couldn't load. URL below — paste it into the other device's browser:",
              el('div', { style: 'font-family:ui-monospace;font-size:12px;word-break:break-all;margin-top:8px' }, url)));
          };
          document.head.appendChild(s);
          return;
        }
        const qr = window.qrcode(0, 'M');
        qr.addData(url);
        qr.make();
        const container = el('div');
        container.innerHTML = qr.createSvgTag(5, 8);
        const svg = container.firstChild;
        if (svg && svg.tagName && svg.tagName.toLowerCase() === 'svg') {
          svg.style.maxWidth = '100%';
          svg.style.background = '#fff';
        }
        qrBox.appendChild(container);
        qrBox.appendChild(el('div', { class: 'muted', style: 'font-size:11px;word-break:break-all;margin-top:8px' }, url));
      }
      function toggleQR() {
        if (qrBox.style.display === 'none' || !qrBox.style.display) {
          qrBox.style.display = 'flex';
          qrBox.style.flexDirection = 'column';
          qrBtn.textContent = '✕ Hide QR';
          renderQR();
        } else {
          qrBox.style.display = 'none';
          qrBtn.textContent = '📷 Show QR';
        }
      }
      function renderSyncKey() { /* placeholder for live updates */ if (qrBox.style.display === 'flex') renderQR(); }

      const syncNowBtn = el('button', { class: 'btn', onclick: async () => {
        const c = loadSyncCfg();
        c.server = serverInput.value.trim();
        c.key = keyInput.value.trim();
        saveSyncCfg(c);
        await syncNow();
      } }, '↻ Sync now');
      const disableBtn = el('button', { class: 'btn secondary', onclick: () => {
        if (!confirm('Disable sync? Your local data stays; the server keeps its copy under the existing key.')) return;
        const c = loadSyncCfg();
        delete c.server; delete c.key; saveSyncCfg(c);
        setSyncStatus('off');
        navigate('#/');
      } }, 'Disable sync');

      clear(app);
      app.append(
        header,
        status,
        el('div', { class: 'stack' },
          el('div', { class: 'muted' }, 'Server URL'),
          serverInput,
          el('div', { class: 'muted' }, 'Sync key (anyone with this key can read/write your projects)'),
          keyInput,
          el('div', { class: 'row' }, copyBtn, genBtn, el('div', { style: 'flex:1' }), qrBtn),
          qrBox,
          el('div', { class: 'row' },
            syncNowBtn,
            el('div', { style: 'flex:1' }),
            cfg.key || cfg.server ? disableBtn : null,
          ),
        ),
      );
    }

    // ---- View: options ----
    function renderSettings() {
      const header = el('header', null,
        el('button', { class: 'icon-btn', onclick: () => navigate('#/') }, '←'),
        el('h1', null, 'Options')
      );

      function toggleRow(key, label, hint) {
        const opts = loadOptions();
        const checkbox = el('input', { type: 'checkbox' });
        checkbox.checked = !!opts[key];
        checkbox.addEventListener('change', () => {
          const o = loadOptions();
          o[key] = checkbox.checked;
          saveOptions(o);
        });
        return el('div', { class: 'option-row' },
          el('label', null,
            checkbox,
            el('div', null,
              el('div', null, label),
              el('div', { class: 'option-hint' }, hint),
            ),
          ),
        );
      }

      clear(app);
      app.append(header, el('div', { class: 'stack' },
        toggleRow(
          'stitchMarker',
          '🔖 Stitch marker reminders',
          'After the first stitch of each row, show a banner reminding you to place a stitch marker. Tap the banner to dismiss.'
        ),
      ));
    }

    // ---- URL key import (one-shot, on first load) ----
    function maybeImportFromURL() {
      const u = new URL(location.href);
      const key = u.searchParams.get('syncKey');
      const server = u.searchParams.get('server');
      if (!key && !server) return;
      const cfg = loadSyncCfg();
      const willReplace = (cfg.key && cfg.key !== key) || (cfg.server && cfg.server !== server);
      const msg = willReplace
        ? 'Import sync settings from this link? It will replace your current sync key/server.'
        : 'Set up sync with the values from this link?';
      if (confirm(msg)) {
        if (key) cfg.key = key;
        if (server) cfg.server = server;
        saveSyncCfg(cfg);
      }
      // Strip the params from the URL so a refresh doesn't re-prompt
      u.searchParams.delete('syncKey');
      u.searchParams.delete('server');
      const cleaned = u.pathname + (u.search || '') + (u.hash || '');
      history.replaceState({}, '', cleaned);
    }

    // ---- Dispatcher ----
    let cleanupFns = [];
    function render() {
      cleanupFns.forEach(fn => { try { fn(); } catch (e) {} });
      cleanupFns = [];
      const h = route();
      if (h === '#/' || h === '#' || h === '') renderList();
      else if (h === '#/new') renderNew();
      else if (h === '#/sync') renderSync();
      else if (h === '#/settings') renderSettings();
      else if (h.startsWith('#/p/')) renderTracker(h.slice(4));
      else navigate('#/');
    }
    maybeImportFromURL();
    render();
    // Sync on open if configured
    if ((function () { const c = loadSyncCfg(); return c.key && c.server; })()) {
      syncNow();
    }
  })();
  </script>
</body>
</html>
